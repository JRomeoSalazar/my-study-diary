<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pruebas — Diario de Estudio</title>
  <style>
    body { font-family: sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
    #resumen { font-size: 1.4rem; font-weight: bold; padding: 0.6rem 0.8rem; border-radius: 6px; }
    #resumen.bien { background: #d8f3dc; color: #1b4332; }
    #resumen.mal { background: #ffd6d6; color: #8b0000; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.3rem 0; border-bottom: 1px solid #ddd; }
    .ok { color: #1b4332; font-weight: bold; }
    .fallo { color: #8b0000; font-weight: bold; }
    pre { margin: 0.2rem 0 0 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Pruebas</h1>
  <p id="resumen">Ejecutando pruebas…</p>
  <ul id="resultados"></ul>

  <script src="logica.js"></script>
  <script>
    // ---------- Comprobador ----------

    const resultados = [];

    // Ejecuta una prueba. Si salta un error (por ejemplo, de igual), cuenta como fallo.
    function prueba(nombre, funcion) {
      try {
        funcion();
        resultados.push({ nombre: nombre, paso: true });
      } catch (error) {
        resultados.push({ nombre: nombre, paso: false, detalle: error.message });
        console.error("FALLO: " + nombre + "\n" + error.message);
      }
    }

    // Comprueba que dos valores son iguales (se comparan como JSON)
    function igual(obtenido, esperado) {
      const textoObtenido = JSON.stringify(obtenido);
      const textoEsperado = JSON.stringify(esperado);
      if (textoObtenido !== textoEsperado) {
        throw new Error("Obtenido: " + textoObtenido + "\nEsperado: " + textoEsperado);
      }
    }

    // Pinta el resumen y la lista de pruebas
    function mostrarResultados() {
      const superadas = resultados.filter((r) => r.paso).length;
      const resumen = document.getElementById("resumen");
      resumen.textContent = superadas + " de " + resultados.length + " pruebas superadas";
      resumen.className = superadas === resultados.length ? "bien" : "mal";

      const lista = document.getElementById("resultados");
      resultados.forEach((r) => {
        const elemento = document.createElement("li");

        const estado = document.createElement("span");
        estado.className = r.paso ? "ok" : "fallo";
        estado.textContent = r.paso ? "OK" : "FALLO";
        elemento.appendChild(estado);
        elemento.appendChild(document.createTextNode(" " + r.nombre));

        if (!r.paso) {
          const detalle = document.createElement("pre");
          detalle.textContent = r.detalle;
          elemento.appendChild(detalle);
        }
        lista.appendChild(elemento);
      });
    }

    // ---------- formatearMinutos (CA-5.3) ----------

    prueba("CA-5.3: 0 min → \"0 min\"", () => igual(formatearMinutos(0), "0 min"));
    prueba("CA-5.3: 45 min → \"45 min\"", () => igual(formatearMinutos(45), "45 min"));
    prueba("CA-5.3: 60 min → \"1 h\"", () => igual(formatearMinutos(60), "1 h"));
    prueba("CA-5.3: 105 min → \"1 h 45 min\"", () => igual(formatearMinutos(105), "1 h 45 min"));
    prueba("CA-5.3: 120 min → \"2 h\"", () => igual(formatearMinutos(120), "2 h"));
    prueba("CA-5.3: 1 000 000 min → \"16666 h 40 min\"", () =>
      igual(formatearMinutos(1000000), "16666 h 40 min"));

    // ---------- fechaATexto y textoAFecha ----------

    prueba("fechaATexto: new Date(2026, 7, 3) → \"2026-08-03\"", () =>
      igual(fechaATexto(new Date(2026, 7, 3)), "2026-08-03"));
    prueba("fechaATexto: pone ceros en mes y día (\"2026-01-05\")", () =>
      igual(fechaATexto(new Date(2026, 0, 5)), "2026-01-05"));
    prueba("textoAFecha: \"2026-08-03\" → año, mes y día locales", () => {
      const fecha = textoAFecha("2026-08-03");
      igual([fecha.getFullYear(), fecha.getMonth(), fecha.getDate()], [2026, 7, 3]);
    });
    prueba("textoAFecha: es medianoche local (no se desplaza por UTC)", () => {
      const fecha = textoAFecha("2026-10-05");
      igual([fecha.getHours(), fecha.getMinutes()], [0, 0]);
    });
    prueba("fechaATexto(textoAFecha(x)) devuelve x (incluido el 29-02-2028)", () => {
      ["2026-10-04", "2026-01-01", "2026-12-31", "2028-02-29"].forEach((texto) => {
        igual(fechaATexto(textoAFecha(texto)), texto);
      });
    });

    // ---------- diaAnterior ----------

    prueba("diaAnterior: \"2026-10-05\" → \"2026-10-04\"", () =>
      igual(fechaATexto(diaAnterior(textoAFecha("2026-10-05"))), "2026-10-04"));
    prueba("diaAnterior: cruza mes (\"2026-10-01\" → \"2026-09-30\")", () =>
      igual(fechaATexto(diaAnterior(textoAFecha("2026-10-01"))), "2026-09-30"));
    prueba("diaAnterior: cruza año (\"2027-01-01\" → \"2026-12-31\")", () =>
      igual(fechaATexto(diaAnterior(textoAFecha("2027-01-01"))), "2026-12-31"));
    prueba("diaAnterior: año bisiesto (\"2028-03-01\" → \"2028-02-29\")", () =>
      igual(fechaATexto(diaAnterior(textoAFecha("2028-03-01"))), "2028-02-29"));
    prueba("diaAnterior: cambio de hora (\"2026-03-30\" → \"2026-03-29\" y \"2026-10-26\" → \"2026-10-25\")", () => {
      igual(fechaATexto(diaAnterior(textoAFecha("2026-03-30"))), "2026-03-29");
      igual(fechaATexto(diaAnterior(textoAFecha("2026-10-26"))), "2026-10-25");
    });

    // ---------- inicioDeSemana ----------

    prueba("inicioDeSemana: un lunes es su propio lunes (\"2026-10-05\")", () =>
      igual(fechaATexto(inicioDeSemana(textoAFecha("2026-10-05"))), "2026-10-05"));
    prueba("inicioDeSemana: un domingo pertenece a la semana anterior (\"2026-10-04\" → \"2026-09-28\")", () =>
      igual(fechaATexto(inicioDeSemana(textoAFecha("2026-10-04"))), "2026-09-28"));
    prueba("inicioDeSemana: mitad de semana (miércoles \"2026-09-30\" → \"2026-09-28\")", () =>
      igual(fechaATexto(inicioDeSemana(textoAFecha("2026-09-30"))), "2026-09-28"));
    prueba("inicioDeSemana: cruza mes (jueves \"2026-10-01\" → \"2026-09-28\")", () =>
      igual(fechaATexto(inicioDeSemana(textoAFecha("2026-10-01"))), "2026-09-28"));
    prueba("inicioDeSemana: cruza año (viernes \"2027-01-01\" → \"2026-12-28\")", () =>
      igual(fechaATexto(inicioDeSemana(textoAFecha("2027-01-01"))), "2026-12-28"));

    // ---------- Constantes de texto ----------

    prueba("CA-6.2: DIAS_CORTOS empieza en lunes (lun, mar, mié, jue, vie, sáb, dom)", () =>
      igual(DIAS_CORTOS, ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"]));
    prueba("CA-6.6/6.7: TRAMOS_LEYENDA tiene los 5 tramos de la leyenda", () =>
      igual(TRAMOS_LEYENDA, ["0 min", "1–29 min", "30–59 min", "60–119 min", "120 min o más"]));
    prueba("CA-6.8/5.2: MESES_CORTOS tiene los 12 meses en español", () =>
      igual(MESES_CORTOS, ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"]));
    prueba("CA-6.8: SEMANAS_MAPA es 12", () => igual(SEMANAS_MAPA, 12));
    prueba("CA-5.4: TEXTO_DETALLE_INICIAL", () =>
      igual(TEXTO_DETALLE_INICIAL, "Pasa el ratón o toca un día para ver sus minutos."));

    // ---------- esFechaValida ----------

    prueba("esFechaValida: \"2026-08-03\" → true", () => igual(esFechaValida("2026-08-03"), true));
    prueba("esFechaValida: formatos incorrectos → false (\"2026-8-3\", con hora, número, vacío)", () => {
      igual(esFechaValida("2026-8-3"), false);
      igual(esFechaValida("2026-08-03T10:00"), false);
      igual(esFechaValida(20260803), false);
      igual(esFechaValida(""), false);
    });
    prueba("esFechaValida: undefined y null → false", () => {
      igual(esFechaValida(undefined), false);
      igual(esFechaValida(null), false);
    });
    prueba("esFechaValida: día inexistente (\"2026-02-30\") → false", () =>
      igual(esFechaValida("2026-02-30"), false));
    prueba("esFechaValida: bisiesto (\"2028-02-29\" → true, \"2027-02-29\" → false)", () => {
      igual(esFechaValida("2028-02-29"), true);
      igual(esFechaValida("2027-02-29"), false);
    });

    // ---------- esSesionValida ----------

    prueba("esSesionValida: sesión correcta → true", () =>
      igual(esSesionValida({ id: 1, fecha: "2026-08-03", tema: "JS", minutos: 45 }), true));
    prueba("esSesionValida: null, números y textos → false", () => {
      igual(esSesionValida(null), false);
      igual(esSesionValida(undefined), false);
      igual(esSesionValida(42), false);
      igual(esSesionValida("texto"), false);
    });
    prueba("esSesionValida: fecha no válida → false", () => {
      igual(esSesionValida({ fecha: "2026-02-30", minutos: 45 }), false);
      igual(esSesionValida({ fecha: "2026-8-3", minutos: 45 }), false);
      igual(esSesionValida({ minutos: 45 }), false);
    });
    prueba("esSesionValida: minutos como texto (\"45\") → false", () =>
      igual(esSesionValida({ fecha: "2026-08-03", minutos: "45" }), false));
    prueba("esSesionValida: minutos 0, −5, 1,5, NaN, Infinity y ausentes → false", () => {
      igual(esSesionValida({ fecha: "2026-08-03", minutos: 0 }), false);
      igual(esSesionValida({ fecha: "2026-08-03", minutos: -5 }), false);
      igual(esSesionValida({ fecha: "2026-08-03", minutos: 1.5 }), false);
      igual(esSesionValida({ fecha: "2026-08-03", minutos: NaN }), false);
      igual(esSesionValida({ fecha: "2026-08-03", minutos: Infinity }), false);
      igual(esSesionValida({ fecha: "2026-08-03" }), false);
    });
    prueba("esSesionValida: claves en inglés (date/minutes) → false", () =>
      igual(esSesionValida({ date: "2026-08-03", minutes: 45 }), false));
    prueba("esSesionValida: sin tema o con id repetido → true", () => {
      igual(esSesionValida({ fecha: "2026-08-03", minutos: 45 }), true);
      igual(esSesionValida({ id: 7, fecha: "2026-08-03", minutos: 45 }), true);
      igual(esSesionValida({ id: 7, fecha: "2026-08-04", minutos: 10 }), true);
    });

    // ---------- comoLista ----------

    prueba("comoLista: null, {}, \"texto\" y 42 → []", () => {
      igual(comoLista(null), []);
      igual(comoLista({}), []);
      igual(comoLista("texto"), []);
      igual(comoLista(42), []);
      igual(comoLista(undefined), []);
    });
    prueba("comoLista: una lista se devuelve tal cual", () => {
      const lista = [{ fecha: "2026-08-03", minutos: 45 }];
      igual(comoLista(lista), lista);
      igual(comoLista([]), []);
    });

    // ---------- sumarDias ----------

    prueba("sumarDias: suma y resta dentro del mes (\"2026-10-05\" +3 → \"2026-10-08\", −4 → \"2026-10-01\")", () => {
      igual(sumarDias("2026-10-05", 3), "2026-10-08");
      igual(sumarDias("2026-10-05", -4), "2026-10-01");
      igual(sumarDias("2026-10-05", 0), "2026-10-05");
    });
    prueba("sumarDias: cruza mes (\"2026-09-30\" +1 → \"2026-10-01\", \"2026-10-01\" −1 → \"2026-09-30\")", () => {
      igual(sumarDias("2026-09-30", 1), "2026-10-01");
      igual(sumarDias("2026-10-01", -1), "2026-09-30");
    });
    prueba("sumarDias: cruza año (\"2026-12-31\" +1 → \"2027-01-01\", \"2027-01-01\" −1 → \"2026-12-31\")", () => {
      igual(sumarDias("2026-12-31", 1), "2027-01-01");
      igual(sumarDias("2027-01-01", -1), "2026-12-31");
    });
    prueba("sumarDias: 29-02-2028 (\"2028-02-28\" +1 → \"2028-02-29\", +2 → \"2028-03-01\")", () => {
      igual(sumarDias("2028-02-28", 1), "2028-02-29");
      igual(sumarDias("2028-02-28", 2), "2028-03-01");
    });
    prueba("sumarDias: alrededor del cambio de hora, +1 día da el siguiente (\"2026-03-28\" y \"2026-10-24\")", () => {
      igual(sumarDias("2026-03-28", 1), "2026-03-29");
      igual(sumarDias("2026-03-29", 1), "2026-03-30");
      igual(sumarDias("2026-10-24", 1), "2026-10-25");
      igual(sumarDias("2026-10-25", 1), "2026-10-26");
    });
    prueba("sumarDias: 84 días a través del cambio de hora (\"2026-03-01\" +84 → \"2026-05-24\")", () =>
      igual(sumarDias("2026-03-01", 84), "2026-05-24"));

    // ---------- lunesDeLaSemana ----------

    prueba("lunesDeLaSemana: un lunes es su propio lunes (\"2026-10-05\", no el domingo anterior)", () =>
      igual(lunesDeLaSemana("2026-10-05"), "2026-10-05"));
    prueba("lunesDeLaSemana: un domingo (\"2026-10-04\" → \"2026-09-28\")", () =>
      igual(lunesDeLaSemana("2026-10-04"), "2026-09-28"));
    prueba("lunesDeLaSemana: mitad de semana y cruce de año (\"2026-09-30\" → \"2026-09-28\", \"2027-01-01\" → \"2026-12-28\")", () => {
      igual(lunesDeLaSemana("2026-09-30"), "2026-09-28");
      igual(lunesDeLaSemana("2027-01-01"), "2026-12-28");
    });

    // ---------- calcularMinutosPorDia ----------

    prueba("CA-2.1: 20 + 15 + 10 el mismo día → 45", () =>
      igual(calcularMinutosPorDia([
        { id: 1, fecha: "2026-10-05", tema: "a", minutos: 20 },
        { id: 2, fecha: "2026-10-05", tema: "b", minutos: 15 },
        { id: 3, fecha: "2026-10-05", tema: "c", minutos: 10 }
      ], "2026-07-20", "2026-10-05"), { "2026-10-05": 45 }));
    prueba("CA-2.1: dos sesiones idénticas se suman las dos", () => {
      const sesion = { id: 1, fecha: "2026-10-05", tema: "a", minutos: 30 };
      igual(calcularMinutosPorDia([sesion, sesion], "2026-07-20", "2026-10-05"), { "2026-10-05": 60 });
    });
    prueba("CA-2.1: días distintos van en claves distintas", () =>
      igual(calcularMinutosPorDia([
        { fecha: "2026-10-04", minutos: 20 },
        { fecha: "2026-10-05", minutos: 15 }
      ], "2026-07-20", "2026-10-05"), { "2026-10-04": 20, "2026-10-05": 15 }));
    prueba("CA-8.2: una válida (30) y una no válida el mismo día → 30", () =>
      igual(calcularMinutosPorDia([
        { fecha: "2026-10-05", minutos: 30 },
        { fecha: "2026-10-05", minutos: "45" },
        { fecha: "2026-10-05", minutos: -5 },
        null
      ], "2026-07-20", "2026-10-05"), { "2026-10-05": 30 }));
    prueba("CA-2.3: fuera del rango no aparecen (domingo anterior al primer lunes y posterior a \"hasta\")", () =>
      igual(calcularMinutosPorDia([
        { fecha: "2026-07-19", minutos: 10 },
        { fecha: "2026-10-06", minutos: 20 },
        { fecha: "2026-07-20", minutos: 30 },
        { fecha: "2026-10-05", minutos: 40 }
      ], "2026-07-20", "2026-10-05"), { "2026-07-20": 30, "2026-10-05": 40 }));
    prueba("CA-2.3: sin sesiones, o con lo guardado vacío → {}", () => {
      igual(calcularMinutosPorDia([], "2026-07-20", "2026-10-05"), {});
      igual(calcularMinutosPorDia([{ fecha: "2026-01-01", minutos: 10 }], "2026-07-20", "2026-10-05"), {});
    });
    prueba("CA-8.4: la lista de entrada es igual antes y después", () => {
      const lista = [
        { id: 1, fecha: "2026-10-05", tema: "a", minutos: 20 },
        { id: 2, fecha: "2026-10-05", tema: "b", minutos: "mal" },
        { id: 3, fecha: "2020-01-01", tema: "c", minutos: 10 }
      ];
      const antes = JSON.stringify(lista);
      calcularMinutosPorDia(lista, "2026-07-20", "2026-10-05");
      igual(JSON.stringify(lista), antes);
    });

    // ---------- calcularNivel ----------

    prueba("CA-3.1: nivel 0 con 0 minutos", () => igual(calcularNivel(0), 0));
    prueba("CA-3.1: nivel 1 de 1 a 29 minutos", () => {
      igual(calcularNivel(1), 1);
      igual(calcularNivel(29), 1);
    });
    prueba("CA-3.1: nivel 2 de 30 a 59 minutos", () => {
      igual(calcularNivel(30), 2);
      igual(calcularNivel(59), 2);
    });
    prueba("CA-3.1: nivel 3 de 60 a 119 minutos", () => {
      igual(calcularNivel(60), 3);
      igual(calcularNivel(119), 3);
    });
    prueba("CA-3.1: nivel 4 con 120 minutos o más (120, 900, 1 000 000)", () => {
      igual(calcularNivel(120), 4);
      igual(calcularNivel(900), 4);
      igual(calcularNivel(1000000), 4);
    });

    // ---------- formatearFechaCorta y textoDetalle ----------

    prueba("CA-5.2: los 7 días de la semana (lun, mar, mié, jue, vie, sáb, dom)", () => {
        igual(formatearFechaCorta("2026-10-05"), "lun 5 oct 2026");
        igual(formatearFechaCorta("2026-10-06"), "mar 6 oct 2026");
        igual(formatearFechaCorta("2026-10-07"), "mié 7 oct 2026");
        igual(formatearFechaCorta("2026-10-08"), "jue 8 oct 2026");
        igual(formatearFechaCorta("2026-10-09"), "vie 9 oct 2026");
        igual(formatearFechaCorta("2026-10-10"), "sáb 10 oct 2026");
        igual(formatearFechaCorta("2026-10-11"), "dom 11 oct 2026");
    });
    prueba("CA-5.2: los 12 meses (ene … sep … dic), sin puntos ni comas", () => {
        igual(formatearFechaCorta("2026-01-15"), "jue 15 ene 2026");
        igual(formatearFechaCorta("2026-02-15"), "dom 15 feb 2026");
        igual(formatearFechaCorta("2026-03-15"), "dom 15 mar 2026");
        igual(formatearFechaCorta("2026-04-15"), "mié 15 abr 2026");
        igual(formatearFechaCorta("2026-05-15"), "vie 15 may 2026");
        igual(formatearFechaCorta("2026-06-15"), "lun 15 jun 2026");
        igual(formatearFechaCorta("2026-07-15"), "mié 15 jul 2026");
        igual(formatearFechaCorta("2026-08-15"), "sáb 15 ago 2026");
        igual(formatearFechaCorta("2026-09-15"), "mar 15 sep 2026");
        igual(formatearFechaCorta("2026-10-15"), "jue 15 oct 2026");
        igual(formatearFechaCorta("2026-11-15"), "dom 15 nov 2026");
        igual(formatearFechaCorta("2026-12-15"), "mar 15 dic 2026");
    });
    prueba("CA-5.2: día sin cero inicial (\"2026-01-05\" → \"lun 5 ene 2026\")", () =>
      igual(formatearFechaCorta("2026-01-05"), "lun 5 ene 2026"));
    prueba("CA-5.2: año con 4 cifras y día 29-02-2028 (\"mar 29 feb 2028\")", () =>
      igual(formatearFechaCorta("2028-02-29"), "mar 29 feb 2028"));
    prueba("CA-5.1: textoDetalle(\"2026-08-03\", 75) → \"lun 3 ago 2026: 1 h 15 min\"", () =>
      igual(textoDetalle("2026-08-03", 75), "lun 3 ago 2026: 1 h 15 min"));
    prueba("CA-5.1: textoDetalle con 0, 45 y 120 minutos", () => {
      igual(textoDetalle("2026-08-03", 0), "lun 3 ago 2026: 0 min");
      igual(textoDetalle("2026-08-03", 45), "lun 3 ago 2026: 45 min");
      igual(textoDetalle("2026-08-03", 120), "lun 3 ago 2026: 2 h");
    });

    // ---------- calcularEtiquetasMes ----------

    // Construye a mano las 12 columnas del mapa hasta "hoy" (como hará calcularMapa):
    // cada columna es una lista de días { fecha }; los huecos (días futuros) no existen.
    function semanasHasta(hoy) {
      const primerDia = sumarDias(lunesDeLaSemana(hoy), -(SEMANAS_MAPA - 1) * 7);
      const semanas = [];
      for (let s = 0; s < SEMANAS_MAPA; s++) {
        const columna = [];
        for (let d = 0; d < 7; d++) {
          const fecha = sumarDias(primerDia, s * 7 + d);
          if (fecha <= hoy) {
            columna.push({ fecha: fecha });
          }
        }
        semanas.push(columna);
      }
      return semanas;
    }
    // Crea la lista esperada de 12 textos: vacía salvo las columnas indicadas
    function etiquetasEsperadas(columnasConMes) {
      const esperadas = [];
      for (let s = 0; s < SEMANAS_MAPA; s++) {
        esperadas.push(columnasConMes[s] || "");
      }
      return esperadas;
    }
