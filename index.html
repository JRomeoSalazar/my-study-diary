<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de Estudio</h1>

    <section class="tarjeta racha">
      <p class="racha-titulo">Racha actual</p>
      <p class="racha-numero">🔥 <span id="racha-dias">0</span></p>
      <p class="racha-texto" id="racha-texto">días seguidos</p>
      <p class="racha-mejor" id="mejor-racha" hidden></p>
    </section>

    <section class="tarjeta">
      <h2>Registrar sesión</h2>
      <form id="formulario">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" placeholder="Ej.: Matemáticas" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" min="1" step="1" placeholder="Ej.: 30" required>

        <p class="error" id="error"></p>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Sesiones</h2>
      <p class="vacio" id="vacio">Todavía no has registrado ninguna sesión.</p>
      <ul class="lista" id="lista"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
